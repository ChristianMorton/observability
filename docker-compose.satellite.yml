# Observability SATELLITE — one per hub user (hub, staging, apps) and on prod.
# Forwards that daemon's container logs, container stats and app OTLP to the main
# collector over the tailnet. See otel-collector-satellite.yaml.
#
# Per-deployment settings come from env (CI job or satellite.env):
#   DOCKER_SOCK   rootless: /run/user/<uid>/docker.sock
#   DOCKER_DATA   rootless: /home/<user>/.local/share/docker
#   SAT_PORT      loopback port prefix, e.g. 303 -> 127.0.0.1:30317/30318/30133
#   SAT_HOST / SAT_ENV  host.name / deployment.environment labels
#
# Apps join the external `observability` network and push to
# http://otel-collector:4317 — identical on every user and host.

name: observability-satellite

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    container_name: observability-satellite-otel-collector
    restart: unless-stopped
    user: "0"
    command: ["--config", "/etc/otelcol-contrib/config.yaml"]
    environment:
      HUB_OTLP_ENDPOINT: ${HUB_OTLP_ENDPOINT:?Set the collector endpoint on your private network}
      SAT_HOST: ${SAT_HOST:-hub}
      SAT_ENV: ${SAT_ENV:-unknown}
    volumes:
      - ./otel-collector-satellite.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - obs_satellite_otelcol-storage:/var/lib/otelcol/file_storage
    ports:
      - "127.0.0.1:${SAT_PORT:-43}17:4317"
      - "127.0.0.1:${SAT_PORT:-43}18:4318"
      - "127.0.0.1:${SAT_PORT:-131}33:13133"
    networks:
      observability:
        aliases: [otel-collector]
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  log-shipper:
    image: grafana/alloy:v1.11.3
    container_name: observability-satellite-alloy
    restart: unless-stopped
    user: "0"
    command: ["run", "--storage.path=/var/lib/alloy", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    environment:
      SAT_HOST: ${SAT_HOST:-hub}
      SAT_ENV: ${SAT_ENV:-unknown}
    volumes:
      - ./alloy-satellite.alloy:/etc/alloy/config.alloy:ro
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - obs_satellite_alloy-data:/var/lib/alloy
    depends_on: [otel-collector]
    networks: [observability]
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  obs_satellite_otelcol-storage:
  obs_satellite_alloy-data:

networks:
  # Created by satellite-up.sh if missing (apps' daemon already had one).
  observability:
    name: observability
    external: true
