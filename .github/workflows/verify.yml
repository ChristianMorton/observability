name: Verify
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML -r mcp-server/requirements.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: docker compose config --quiet
        env:
          GRAFANA_ADMIN_PASSWORD: ci-validation-only
          GF_SECURITY_SECRET_KEY: ci-validation-only
          MCP_API_KEY: ci-validation-only
