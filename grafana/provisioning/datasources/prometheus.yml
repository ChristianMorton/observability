apiVersion: 1

# One-off UID migration: Grafana cannot change the UID of an existing
# datasource in place ("data source not found"), so delete it by name and
# let it be recreated with the pinned UID. Harmless on later starts.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 30s
