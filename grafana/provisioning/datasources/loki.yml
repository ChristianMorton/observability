apiVersion: 1

# One-off UID migration: Grafana cannot change the UID of an existing
# datasource in place ("data source not found"), so delete it by name and
# let it be recreated with the pinned UID. Harmless on later starts.
deleteDatasources:
  - name: Loki
    orgId: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"([a-f0-9]+)"'
          url: http://localhost:16686/trace/$${__value.raw}
          datasourceUid: jaeger
          urlDisplayLabel: "View in Jaeger"
